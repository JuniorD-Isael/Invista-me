{% extends 'investimentos/base.html' %}
{% block conteudo %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Confirma exclusão do {{ item.investimento }}</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <a href="{% url 'investimentos' %}" class="btn btn-secondary">Cancelar</a>
            <button class="btn btn-danger" type="submit">Confirmar</button>
        </div>
    </form>
</div>
{% endblock %}
